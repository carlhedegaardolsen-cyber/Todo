<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Todo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    color: #222;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 25px;
}

.date {
    color: #999;
    font-size: 14px;
    margin-bottom: 15px;
}

.tabs {
    display: flex;
    gap: 25px;
    border-bottom: 1px solid #eee;
    margin-bottom: 30px;
}

.tab {
    border: none;
    background: none;
    padding: 12px 5px;
    color: #999;
    cursor: pointer;
    font-size: 15px;
}

.tab.active {
    color: #222;
    border-bottom: 2px solid #222;
}

h1 {
    font-size: 32px;
    margin: 0 0 5px;
}

.subtitle {
    color: #888;
    margin-bottom: 25px;
}

.input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

input {
    flex: 1;
    padding: 13px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 5px;
}

button {
    cursor: pointer;
}

.add {
    background: #222;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 0 22px;
}

.search {
    margin-bottom: 25px;
}

.section-title {
    font-weight: bold;
    margin: 20px 0 8px;
}

.todo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #f1f1f1;
}

.todo span {
    flex: 1;
}

.todo button {
    border: none;
    background: none;
    color: #999;
}

.completed {
    color: #999;
}

.footer {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    color: #999;
    font-size: 13px;
}

.hidden {
    display: none;
}

.fitness-entry {
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}
</style>
</head>

<body>

<div class="container">

    <div class="date" id="date"></div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('todos')">Todos</button>
        <button class="tab" onclick="showTab('fitness')">Fitness</button>
    </div>

    <!-- TODOS -->

    <div id="todosTab">

        <h1>My Todos</h1>
        <div class="subtitle">What needs to get done?</div>

        <div class="input-row">
            <input id="todoInput" placeholder="Add a task...">
            <button class="add" onclick="addTodo()">Add</button>
        </div>

        <input
            id="searchInput"
            class="search"
            placeholder="Search..."
            oninput="renderTodos()"
        >

        <div class="section-title">Tasks</div>

        <div id="todoList"></div>

        <div class="section-title">Completed</div>

        <div id="completedList"></div>

        <div class="footer">
            <span id="count"></span>
            <button onclick="clearCompleted()">Clear completed</button>
        </div>

    </div>


    <!-- FITNESS -->

    <div id="fitnessTab" class="hidden">

        <h1>Fitness</h1>
        <div class="subtitle">Keep track of what you achieved.</div>

        <div class="input-row">
            <input id="fitnessInput" placeholder="e.g. Bench 60kg × 8">
            <button class="add" onclick="addFitness()">Log</button>
        </div>

        <div id="fitnessList"></div>

        <div class="footer">
            <span id="fitnessCount"></span>
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL = "https://irfxcecruqjtzrxyzmxk.supabase.com";

const SUPABASE_KEY = "sb_publishable_FVuQJxc6wVNA9ZTP8rMeXA_vULIdzDx";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   DATE
   ========================================================= */

document.getElementById("date").textContent =
    new Date().toLocaleDateString(
        "en-GB",
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );


/* =========================================================
   TABS
   ========================================================= */

function showTab(tab) {

    document.getElementById("todosTab")
        .classList.toggle("hidden", tab !== "todos");

    document.getElementById("fitnessTab")
        .classList.toggle("hidden", tab !== "fitness");

    document.querySelectorAll(".tab").forEach(button => {
        button.classList.remove("active");
    });

    event.target.classList.add("active");
}


/* =========================================================
   TODOS
   ========================================================= */

async function loadTodos() {

    const { data, error } = await db
        .from("todos")
        .select("*")
        .order("created_at", { ascending: true });

    if (error) {
        console.error(error);
        return;
    }

    window.todos = data;

    renderTodos();
}


function renderTodos() {

    const list = document.getElementById("todoList");
    const completed = document.getElementById("completedList");

    list.innerHTML = "";
    completed.innerHTML = "";

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    let activeCount = 0;

    window.todos
        .filter(todo =>
            todo.text.toLowerCase().includes(search)
        )
        .forEach(todo => {

            const row = document.createElement("div");
            row.className = "todo";

            if (todo.completed) {

                row.classList.add("completed");

                row.innerHTML = `
                    <span>✓ ${escapeHtml(todo.text)}</span>
                    <button onclick="uncompleteTodo(${todo.id})">Undo</button>
                    <button onclick="deleteTodo(${todo.id})">Delete</button>
                `;

                completed.appendChild(row);

            } else {

                activeCount++;

                row.innerHTML = `
                    <span>○ ${escapeHtml(todo.text)}</span>
                    <button onclick="completeTodo(${todo.id})">Done</button>
                    <button onclick="deleteTodo(${todo.id})">Delete</button>
                `;

                list.appendChild(row);
            }
        });

    document.getElementById("count").textContent =
        activeCount + (activeCount === 1
            ? " task remaining"
            : " tasks remaining");
}


async function addTodo() {

    const input = document.getElementById("todoInput");

    const text = input.value.trim();

    if (!text) return;

    const { error } = await db
        .from("todos")
        .insert({
            text: text,
            completed: false
        });

    if (error) {
        console.error(error);
        alert("Could not add todo.");
        return;
    }

    input.value = "";

    await loadTodos();
}


async function completeTodo(id) {

    await db
        .from("todos")
        .update({ completed: true })
        .eq("id", id);

    await loadTodos();
}


async function uncompleteTodo(id) {

    await db
        .from("todos")
        .update({ completed: false })
        .eq("id", id);

    await loadTodos();
}


async function deleteTodo(id) {

    await db
        .from("todos")
        .delete()
        .eq("id", id);

    await loadTodos();
}


async function clearCompleted() {

    await db
        .from("todos")
        .delete()
        .eq("completed", true);

    await loadTodos();
}


/* =========================================================
   FITNESS
   ========================================================= */

async function loadFitness() {

    const { data, error } = await db
        .from("fitness_logs")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        return;
    }

    window.fitnessLogs = data;

    renderFitness();
}


function renderFitness() {

    const list =
        document.getElementById("fitnessList");

    list.innerHTML = "";

    window.fitnessLogs.forEach(log => {

        const row =
            document.createElement("div");

        row.className = "fitness-entry";

        row.innerHTML =
            `${log.date} — ${escapeHtml(log.text)}
             <button onclick="deleteFitness(${log.id})">
             Delete
             </button>`;

        list.appendChild(row);
    });

    document.getElementById("fitnessCount").textContent =
        window.fitnessLogs.length +
        (window.fitnessLogs.length === 1
            ? " workout entry"
            : " workout entries");
}


async function addFitness() {

    const input =
        document.getElementById("fitnessInput");

    const text = input.value.trim();

    if (!text) return;

    const { error } = await db
        .from("fitness_logs")
        .insert({
            date: new Date().toLocaleDateString("en-GB"),
            text: text
        });

    if (error) {
        console.error(error);
        alert("Could not save fitness entry.");
        return;
    }

    input.value = "";

    await loadFitness();
}


async function deleteFitness(id) {

    await db
        .from("fitness_logs")
        .delete()
        .eq("id", id);

    await loadFitness();
}


/* =========================================================
   SECURITY
   ========================================================= */

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   ENTER KEY
   ========================================================= */

document.getElementById("todoInput")
    .addEventListener("keydown", event => {

        if (event.key === "Enter") {
            addTodo();
        }

    });


document.getElementById("fitnessInput")
    .addEventListener("keydown", event => {

        if (event.key === "Enter") {
            addFitness();
        }

    });


/* =========================================================
   START
   ========================================================= */

window.todos = [];

window.fitnessLogs = [];

loadTodos();

loadFitness();

</script>

</body>
</html>
